# Supply-chain hardening: delay installing freshly published versions (7 days)
# so malware caught and unpublished within hours never lands, and fail installs
# when a package's trust signals (provenance/signatures) weaken between releases.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Narrow exclusions: transitive deps of shadcn v4's babel toolchain whose older
# pinned versions predate provenance attestation. Excluded intentionally so the
# no-downgrade policy still guards everything else.
trustPolicyExclude:
  - "semver@6.3.1"
# Exempt from the 7-day release-age quarantine: security patches we want
# immediately. Keep this list narrow so the quarantine still applies elsewhere.
minimumReleaseAgeExclude:
  - "brace-expansion"
  - "fast-uri"
  - "hono"
  - "qs"
overrides:
  "@babel/core": "7.29.7"
  "@humanfs/node": "0.16.8"
  "@hono/node-server": ">=2.0.5"
  brace-expansion@1: "^1.1.21"
  browserslist: "4.28.7"
  diff: "8.0.3"
  esbuild: ">=0.28.1"
  fast-uri@4: "^4.1.5"
  flatted: "3.4.2"
  hono: "^4.13.11"
  ip-address: "^10.7.1"
  js-yaml@^3.13.1: "^3.15.2"
  js-yaml@^4.1.0: "^4.3.2"
  js-yaml@^4.1.1: "^4.3.2"
  minimatch@^3.1.2: "3.1.4"
  nanoid@^3.3.16: "3.3.18"
  path-to-regexp: "8.4.0"
  picomatch@^2.0.0: "2.3.2"
  picomatch@^4.0.3: "4.0.4"
  postcss: "8.5.23"
  qs: "6.16.0"
  sharp: ">=0.35.5"
  undici@7: "^7.29.1"
  next: "^16.3.8"
  baseline-browser-mapping: "^2.11.0"
  postcss-selector-parser: "^7.1.6"
  proxy-addr: "^2.0.8"
  source-map-js: "^1.2.2"
  argparse: "^2.0.1"
  yaml: "2.8.3"
  "@modelcontextprotocol/sdk": "^1.32.0"
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
